version: 2
updates:
  # Dart health check (api-tests/healthcheck/pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/api-tests/healthcheck"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
